load_module /etc/nginx/modules/ngx_stream_brutal_module.so;
error_log stderr notice;
pid /tmp/brutal-smoke.pid;
events {}
stream {
    server {
        listen 127.0.0.1:19443;
        ssl_preread on;
        brutal_sni test.example.com download_mbps=300 gain=15;
        proxy_pass 127.0.0.1:19000;
    }
}
